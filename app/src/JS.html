<script>
(function () {
'use strict';

// ───────────── basics ─────────────
const BOOT = document.getElementById('boot').dataset;
const $app = document.getElementById('app');
const S = { token: '', me: null, tab: '', week: '', day: '', timer: null, users: null, filter: 'all' };

const store = {
  get(k) { try { return JSON.parse(localStorage.getItem('lr_' + k) || 'null'); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem('lr_' + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem('lr_' + k); } catch (e) {} },
};
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => { t.hidden = true; }, 2600);
}
const CFG = window.APP_CONFIG || {};
const BA_REFERRAL = 'Friend who works here (BA referral)';
function call(action, payload) {
  const req = Object.assign({}, payload || {}, { action: action, token: S.token });
  let p;
  if (CFG.API_URL) {
    // Installable app (GitHub Pages): plain-text POST to the Apps Script /exec URL. Give up on a hung request after 45s.
    const ctl = window.AbortController ? new AbortController() : null, t = ctl && setTimeout(() => ctl.abort(), 45000);
    p = fetch(CFG.API_URL, { method: 'POST', body: JSON.stringify(req), signal: ctl ? ctl.signal : undefined })
      .then(r => r.json()).then(j => { clearTimeout(t); return j; }, e => { clearTimeout(t); throw e; });
  } else if (window.google && google.script) {
    p = new Promise((res, rej) => google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(req));
  } else {
    return Promise.reject(new Error('This app is not connected yet (admin: add the Apps Script link to config.js).'));
  }
  return p.then(res => {
    if (res && res.ok) return res.data;
    if (res && res.auth) { store.del('tok'); S.token = ''; S.me = null; startStaff(); return new Promise(() => {}); } // session expired → login
    const e = new Error((res && res.error) || 'Something went wrong'); e.retry = !!(res && res.retry); throw e;
  }, err => {
    const m = (err && err.message) || '';
    const offline = !err || err.name === 'TypeError' || err.name === 'AbortError' || /fetch|load failed|network|internet|offline|abort|JSON/i.test(m);
    const e = new Error(offline ? 'No connection — check your signal and try again' : m); e.retry = offline; throw e;
  });
}
/** Candidate pages: when Google is busy (lots sending at once) or the signal drops, quietly try again
 *  (after 2, 4, 8, 12s) instead of showing an error. Safe: check-in and evaluation can't be sent twice. */
function callRetry(action, payload, onWait, tries) {
  const waits = [2000, 4000, 8000, 12000].slice(0, tries === undefined ? 4 : tries);
  const attempt = i => call(action, payload).catch(e => {
    if (!e.retry || i >= waits.length) throw e;
    if (onWait) onWait(i + 1);
    return new Promise(r => setTimeout(r, waits[i])).then(() => attempt(i + 1));
  });
  return attempt(0);
}
function stopTimer() { if (S.timer) { clearInterval(S.timer); S.timer = null; } }
function londonToday() { return londonNow().slice(0, 10); }
/** Same rule as Google's: a UK mobile, however it's typed (+44, 0044, spaces). '' if it isn't one. */
function ukMobile(s) {
  let d = String(s || '').replace(/[^\d+]/g, '');
  if (d.indexOf('+44') === 0) d = '0' + d.slice(3); else if (d.indexOf('0044') === 0) d = '0' + d.slice(4); else if (d.indexOf('44') === 0 && d.length === 12) d = '0' + d.slice(2);
  d = d.replace(/\D/g, ''); if (/^7\d{9}$/.test(d)) d = '0' + d;
  return /^07\d{9}$/.test(d) ? d : '';
}
function firstOf(name) { return String(name || '').trim().split(/\s+/)[0].toLowerCase().replace(/\b\w/g, c => c.toUpperCase()); }
// ───── Candidate sends (check-in, evaluation, Confirm): shown as done straight away, delivered in the background ─────
// Kept on the phone until Google has it: retried with back-off, and again the next time any of our pages opens.
const SEND_GEN = {};
function sendq() { return store.get('sendq') || {}; }
function sendSoon(key, action, payload, onDone, onFail) {
  const q = sendq(); q[key] = { action: action, payload: payload }; store.set('sendq', q);
  const gen = SEND_GEN[key] = (SEND_GEN[key] || 0) + 1;
  const drop = () => { const x = sendq(); delete x[key]; store.set('sendq', x); };
  const go = n => call(action, payload).then(r => {
    if (SEND_GEN[key] === gen) drop();
    afterSend(action, payload, r); if (onDone) onDone(r);
  }, e => {
    if (SEND_GEN[key] !== gen) return;  // a newer send of the same thing took over
    if (e.retry) return void setTimeout(() => go(n + 1), Math.min(30000, 2000 * Math.pow(2, n)));
    drop(); if (onFail) onFail(e);
  });
  go(0);
}
function resendPending() { const q = sendq(); Object.keys(q).forEach(k => sendSoon(k, q[k].action, q[k].payload)); }
/** What the phone remembers once Google has it (also when it lands after the page was closed and opened again). */
function afterSend(action, p, r) {
  if (action === 'submitEval') store.del('evaldraft_' + p.id);
  if (action === 'confirmAcademy') { const w = store.get('wl_' + p.t); if (w && !w.confirmed_at) { w.confirmed_at = londonNow(); store.set('wl_' + p.t, w); } }
  if (action === 'checkin' && r && r.id && ukMobile(p.form.mobile) === store.get('lastCheckin')) {
    store.set('cand', { id: r.id, resume: r.resume, first_name: r.first_name, company: coOf(r.company), nq: !!r.nonQual, date: londonToday(), evalDone: !!r.evalDone });
  }
}
/** Warm up the sites behind a page's buttons (DNS + secure connection), so they open the moment they're tapped. */
function warm(urls) {
  urls.filter(Boolean).forEach(u => {
    let o; try { o = new URL(u).origin; } catch (e) { return; }
    if (document.querySelector('link[rel=preconnect][href="' + o + '"]')) return;
    ['preconnect', 'dns-prefetch'].forEach(rel => { const l = document.createElement('link'); l.rel = rel; l.href = o; if (rel === 'preconnect') l.crossOrigin = ''; document.head.appendChild(l); });
  });
}
function scrollTop() { window.scrollTo(0, 0); }
function logos(size) {
  if (C.co) return '<div class="brandbar"><img alt="' + C.co + ' Marketing" src="' + LOGOS[C.co] + '" style="height:' + size + 'px"></div>';
  return '<div class="brandbar"><img alt="LINK Marketing" src="' + LOGOS.LINK + '" style="height:' + size + 'px">' +
    '<span class="x">×</span><img alt="JUSS Marketing" src="' + LOGOS.JUSS + '" style="height:' + size + 'px"></div>';
}

// ───────────── brand look: LINK (orange + charcoal) or JUSS (coral → amber → teal); none = LINK × JUSS ─────────────
function coOf(x) { return x === 'JUSS' ? 'JUSS' : x === 'LINK' ? 'LINK' : ''; }
/** dark: the top of the page is a dark panel, so the phone's status bar goes dark to match. */
function setTheme(co, dark) {
  co = coOf(co);
  const root = document.documentElement;
  root.classList.toggle('t-LINK', co === 'LINK');
  root.classList.toggle('t-JUSS', co === 'JUSS');
  if (document.body) { if (co) document.body.dataset.co = co; else delete document.body.dataset.co; }
  let m = document.querySelector('meta[name=theme-color]');
  if (!m) { m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
  m.content = dark ? (co === 'JUSS' ? '#0D2833' : '#17171D') : (co === 'JUSS' ? '#EDF5F5' : co === 'LINK' ? '#F7F1EC' : '#F4F2EF');  // dark = the stage colour
}
/** The stage inside a dark header: two slow brand lights and the brand as a floating 3D shape (Styles: "Immersive layer"). */
const FX = '<div class="fx" aria-hidden="true"><i class="orb o1"></i><i class="orb o2"></i><div class="prism"><div><span></span><span></span><span></span></div></div></div>';
/** Candidate page logos: both until we know the booker's company (on check-in the other one dims the moment they pick), then just theirs. */
function heroLogos() {
  if (C.co) return '<div class="brandbar c-logos"><img class="lg-' + C.co + '" alt="' + C.co + ' Marketing" src="' + LOGOS[C.co] + '"></div>';
  return '<div class="brandbar c-logos"><img class="lg-LINK" alt="LINK Marketing" src="' + LOGOS.LINK + '"><span class="x">×</span><img class="lg-JUSS" alt="JUSS Marketing" src="' + LOGOS.JUSS + '"></div>';
}
function tickSvg() { return '<div class="tick"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>'; }
function greeting() { const hr = Number(londonNow().slice(11, 13)); return hr < 12 ? 'Good morning,' : hr < 17 ? 'Good afternoon,' : 'Good evening,'; }
const REDUCED = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
/** Big numbers count up from 0 on a fresh screen (instant on the quiet background refresh). */
function countUp(root, instant) {
  root.querySelectorAll('[data-n]').forEach(el => {
    const to = Number(el.dataset.n) || 0;
    if (instant || REDUCED || to === 0) { el.textContent = to; return; }
    const t0 = performance.now(), dur = Math.min(900, 380 + to * 60);
    el.textContent = '0';
    const step = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
/** Cards rise in one after another: each gets its place in the queue. */
function stagger(root) {
  let i = 0;
  root.querySelectorAll('.list > *, :scope > .card, :scope > .hero, :scope > .kpis, :scope > .tiles, :scope > .profile, :scope > section > .card')
    .forEach(el => { el.style.setProperty('--i', Math.min(i++, 10)); });
}

// ───────────── dates (YYYY-MM-DD strings, no time zone surprises) ─────────────
const DAYS = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DAYS_LONG = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
function D(ymd) { return new Date(ymd + 'T00:00:00Z'); }
function addDays(ymd, n) { const d = D(ymd); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function fmt(ymd) { if (!ymd) return ''; const d = D(ymd); return DAYS[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS[d.getUTCMonth()]; }
function fmtLong(ymd) { const d = D(ymd); return DAYS_LONG[d.getUTCDay()] + ' ' + d.getUTCDate() + ' ' + MONTHS_LONG[d.getUTCMonth()]; }
function fmtTs(ts) { return ts ? fmt(ts.slice(0, 10)) + ' ' + ts.slice(11, 16) : ''; }
function nextMonday(ymd) { const w = D(ymd).getUTCDay(); return addDays(ymd, w === 1 ? 7 : (8 - w) % 7 || 7); }

// ───────────── shared form bits ─────────────
/** opts: values, or [value, label] pairs. */
function chips(name, opts, val, stack) {
  return '<div class="chips' + (stack ? ' stack' : '') + '" data-name="' + name + '">' +
    opts.map(o => { const v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o; return '<button type="button" class="chip' + (v === val ? ' on' : '') + '" data-v="' + h(v) + '">' + h(l) + '</button>'; }).join('') + '</div>';
}
function bindChips(root, onChange) {
  root.querySelectorAll('.chips[data-name]').forEach(g => {
    g.addEventListener('click', e => {
      const b = e.target.closest('.chip'); if (!b) return;
      const multi = g.dataset.multi === '1';
      if (multi) b.classList.toggle('on');
      else { g.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); }
      if (onChange) onChange(g.dataset.name, b.dataset.v);
    });
  });
}
function chipVal(root, name) {
  const b = root.querySelector('.chips[data-name="' + name + '"] .chip.on');
  return b ? b.dataset.v : '';
}
function chipVals(root, name) {
  return Array.from(root.querySelectorAll('.chips[data-name="' + name + '"] .chip.on')).map(b => b.dataset.v);
}
function busy(btn, on, label) {
  if (!btn) return;
  if (on) { btn.dataset.l = btn.innerHTML; btn.disabled = true; btn.innerHTML = label || 'Saving…'; }
  else { btn.disabled = false; btn.innerHTML = btn.dataset.l || btn.innerHTML; }
}
function showErr(el, msg) { el.innerHTML = msg ? '<div class="err">' + h(msg) + '</div>' : ''; if (msg) el.scrollIntoView({ block: 'center', behavior: 'smooth' }); }

// ═════════════════════════ CANDIDATE ═════════════════════════
const C = { cfg: null, rec: null, co: '' };

/** Candidate pages wear the booker's company look: LINK = orange + charcoal, JUSS = coral → amber → teal (from their logos).
 *  '' = not known yet (no booker picked, or "not sure"): the joint LINK × JUSS look with both logos. */
function brandTheme(co) { C.co = coOf(co); setTheme(C.co, true); }

function startCandidate() {
  if (BOOT.mode === 'welcome') return startWelcome();
  if (BOOT.mode === 'booked') return startBooked();
  const saved = store.get('cand');
  resendPending();
  if (saved && saved.id && saved.date === londonToday()) {
    C.rec = saved; brandTheme(saved.company);
    if (BOOT.mode === 'eval') saved.evalDone ? renderDone('already') : saved.nq ? renderNoEval() : renderEval();
    else renderCheckedIn(saved.first_name, saved.evalDone, false, saved.nq);
    callRetry('candidateStatus', { id: saved.id, resume: saved.resume }, null, 2).then(reconcile).catch(e => { if (!e.retry) reconcile(null); });
    return;
  }
  // Checked in moments ago and it's still on its way to Google: show that, not an empty form
  const ci = Object.keys(sendq()).filter(k => /^checkin_/.test(k)).map(k => sendq()[k].payload.form).filter(f => ukMobile(f.mobile) === store.get('lastCheckin'))[0];
  if (ci && BOOT.mode !== 'eval') { C.rec = { first_name: firstOf(ci.full_name), company: '', nq: false }; brandTheme(''); return renderCheckedIn(C.rec.first_name, false, false, false); }
  const known = saved && saved.id
    ? callRetry('candidateStatus', { id: saved.id, resume: saved.resume }, null, 2).then(st => (st.attended_date === st.today ? st : null))
      // Busy or no signal: carry on with what this phone already knows (only forget it if Google says it doesn't exist)
      .catch(e => (e.retry ? { first_name: saved.first_name, unknown: true } : null))
    : Promise.resolve(null);
  known.then(st => {
    if (st) {
      C.rec = saved; C.rec.first_name = st.first_name || saved.first_name; C.rec.company = coOf(st.company) || coOf(saved.company);
      if (!st.unknown) C.rec.nq = !!st.nonQual;
      store.set('cand', C.rec);
    } else store.del('cand');
    brandTheme(C.rec && C.rec.company);
    if (BOOT.mode === 'eval') {
      if (st) return st.evalDone ? renderDone('already', st.canEdit) : C.rec.nq ? renderNoEval() : renderEval();
      return renderFind();
    }
    if (st) return renderCheckedIn(C.rec.first_name, st.evalDone, st.canEdit, C.rec.nq);
    loadCheckin('');
  });
}

/** then = 'eval' when someone scans the evaluation QR without having checked in. */
/** Google's answer about someone this phone showed straight in: put right anything it knows better. */
function reconcile(st) {
  if (!st || st.attended_date !== st.today) {
    store.del('cand'); C.rec = null;
    if ($app.dataset.screen !== 'done') BOOT.mode === 'eval' ? renderFind() : loadCheckin('');
    return;
  }
  const was = { nq: !!C.rec.nq, co: C.rec.company }, scr = $app.dataset.screen;
  Object.assign(C.rec, { first_name: st.first_name || C.rec.first_name, company: coOf(st.company) || C.rec.company, nq: !!st.nonQual, evalDone: !!st.evalDone || !!C.rec.evalDone });
  store.set('cand', C.rec);
  if (C.rec.company !== was.co) brandTheme(C.rec.company);
  if (st.evalDone && (scr === 'eval' || scr === 'checkedin')) return renderDone('already', st.canEdit);
  if (scr === 'done' && $app.dataset.donemode === 'already' && st.canEdit) return renderDone('already', true);
  if (C.rec.nq !== was.nq) {
    if (BOOT.mode === 'eval' && scr !== 'done') return C.rec.nq ? renderNoEval() : renderEval();
    if (scr === 'checkedin') return renderCheckedIn(C.rec.first_name, false, false, C.rec.nq);
  }
}

// Same list as Google's (RTW in Code.gs): the form shows straight away; Google's own copy replaces it the moment it arrives.
const RTW_DEFAULT = [['British or Irish citizen', 'ok'], ['Settled status / Indefinite Leave to Remain', 'ok'], ['Pre-settled status', 'ok'], ['Refugee / humanitarian protection', 'ok'],
  ['Graduate visa (PSW)', 'visa'], ['Spouse / partner / family visa', 'visa'], ['Dependant of a Skilled Worker', 'visa'], ['Youth Mobility visa', 'visa'], ['BNO visa', 'visa'], ['Ukraine scheme', 'visa'],
  ['Dependant of a student', 'check'], ['Student visa (Tier 4)', 'no'], ['Skilled Worker / Health & Care visa', 'no'], ['Asylum seeker (decision pending)', 'no'], ['I need visa sponsorship', 'no'], ['Other', 'check']]
  .map(r => ({ label: r[0], level: r[1] }));
/** The check-in form is on screen at once (bookers' names arrive a moment later, before anyone gets to that box). */
function loadCheckin(then, pre, preErr) {
  brandTheme('');
  C.cfg = store.get('cfg') || { bookers: null, rtw: RTW_DEFAULT };
  C.cfg.today = londonToday();
  renderCheckin(then, pre, preErr);
  callRetry('publicConfig', {}, null, 3).then(cfg => { store.set('cfg', cfg); C.cfg = cfg; if (C.onCfg) C.onCfg(); }).catch(() => {});  // typed names are still matched by Google
}

function renderCheckin(then, pre, preErr) {
  scrollTop(); brandTheme('');
  pre = pre || {}; $app.dataset.screen = 'checkin'; $app.dataset.mark = '';
  const sources = ['Indeed', 'TikTok', 'Instagram', 'Facebook', 'LinkedIn', BA_REFERRAL, 'Other'];
  const sec = (icon, title) => '<section class="evsec"><div class="evsec-h"><span>' + icon + '</span>' + title + '</div><div class="qcard ci">';
  $app.innerHTML = '<div class="c-hero">' + FX + heroLogos() + '<span class="label">Recruitment day' + (C.cfg.today ? ' · ' + h(fmtLong(C.cfg.today)) : '') + '</span>' +
    (then === 'eval' ? '<h1>Quick <span class="gtext">check-in</span> first 👋</h1><p>We couldn\'t find you, so fill this in, then your evaluation opens straight after.</p>'
      : '<h1><span class="gtext">Welcome</span> 👋</h1><p>Let\'s check you in. Takes about a minute.</p>') +
    '<div class="evtags"><span>⏱ 1 min</span><span>🔒 Private</span></div><div id="with"></div></div>' +
    '<form id="f" class="evform" novalidate autocomplete="on">' +
    sec('🙋', 'About you') +
    '<label class="q">Full name <span class="req">*</span></label><input type="text" name="full_name" autocomplete="name" placeholder="First and last name" value="' + h(pre.full_name || '') + '">' +
    '<label class="q">Mobile number <span class="req">*</span></label><input type="tel" name="mobile" autocomplete="tel" inputmode="tel" placeholder="07…" value="' + h(pre.mobile || '') + '"><div id="bkfound"></div>' +
    '<label class="q">Email <span class="req">*</span></label><input type="email" name="email" autocomplete="email" placeholder="you@email.com" value="' + h(pre.email || '') + '">' +
    '<label class="q">Are you 18 or over? <span class="req">*</span></label>' + chips('over18', ['Yes', 'No'], pre.over18) + '</div></section>' +
    sec('🤝', 'Your booking') +
    '<label class="q">Who booked you in today? <span class="req">*</span></label>' +
    '<div class="help">Start typing their name, then tap it.</div>' +
    '<div id="bk"></div>' +
    '<label class="check"><input type="checkbox" id="unsure"' + (pre.unsure ? ' checked' : '') + '> I\'m not sure who booked me</label>' +
    '<label class="q">Where did you find us?</label>' + chips('source', sources, pre.source) + '</div></section>' +
    sec('🛂', 'Right to work') +
    '<label class="q">Your right to work in the UK <span class="req">*</span></label>' +
    '<select name="rtw">' + rtwOptions(pre.rtw) + '</select>' +
    '<div id="exp"' + (rtwLevelOf(pre.rtw) === 'visa' ? '' : ' hidden') + '><label class="q">Visa expiry date <span class="req">*</span></label><input type="date" name="visa_expiry" value="' + h(pre.visa_expiry || '') + '"></div>' +
    '<label class="check"><input type="checkbox" name="privacy_ok"' + (pre.privacy_ok ? ' checked' : '') + '> <span>I agree that LINK Marketing and JUSS Marketing can use these details to assess my application and contact me about it. They are kept in full for 12 weeks. After that, only basic details and the result of my application are kept, for up to 6 months, then deleted.</span></label>' +
    '</div></section>' +
    '<div id="err">' + (preErr ? '<div class="err">' + h(preErr) + '</div>' : '') + '</div>' +
    '<button class="btn block evsubmit" id="go" type="submit">Check me in ✅</button>' +
    '</form>';

  const f = document.getElementById('f');
  bindChips(f);
  let booker = pre.booker || null, redraw = null, booking = null;  // booking: booked from the app after a call (found by their mobile)
  // Their company: the booking's (everyone booked after a call is JUSS's), else their booker's
  const coNow = () => booker ? (booking && booking.booker_id === booker.id ? coOf(booking.company) : coOf(booker.company)) : '';
  // Each booker under their own name and every other name they use (a team member, their company): same booker either way
  const bookerNames = () => [].concat.apply([], (C.cfg.bookers || []).map(b => [b].concat((b.aliases || []).map(a => ({ id: b.id, name: a, company: b.company })))));
  // Google's names (and its right-to-work list) landing after the form is already on screen
  C.onCfg = () => {
    if (redraw && document.getElementById('bkq')) redraw();
    if (f.isConnected && !f.rtw.value) f.rtw.innerHTML = rtwOptions('');
  };
  const bk = document.getElementById('bk');
  const withEl = document.getElementById('with');
  document.documentElement.classList.add('theme-anim');
  const drawBooker = (typed) => {
    // Picking the booker switches the page to their company's look (LINK or JUSS)
    const co = coNow();
    brandTheme(co);
    withEl.innerHTML = co ? '<div class="c-with"><img src="' + LOGOS[co] + '" alt="">You\'re with <b>' + co + ' Marketing</b></div>' : '';
    if (booker) {
      bk.innerHTML = '<div class="picked"><span>✓ ' + h(booker.name) + ' <span class="co ' + h(booker.company) + '">' + h(booker.company) + '</span></span>' +
        '<button type="button" class="btn ghost sm" id="chg">Change</button></div>';
      document.getElementById('chg').onclick = () => { booker = null; drawBooker(''); bk.querySelector('input').focus(); };
      return;
    }
    bk.innerHTML = '<input type="text" id="bkq" autocomplete="off" placeholder="Type their name…" value="' + h(typed || '') + '"><div id="sg"></div>';
    const inp = document.getElementById('bkq');
    const sg = document.getElementById('sg');
    const draw = () => {
      const q = inp.value.trim().toLowerCase();
      if (q.length < 2) { sg.innerHTML = ''; return; }

    call('bookingByMobile', { mobile: m }).then(r => {

  };

      if (exact.length === 1) booker = exact[0];

    };
    if (!form.full_name.trim() || !form.mobile.trim() || !form.email.trim()) return showErr(err, 'Please fill in your name, mobile and email.');
    // Google's own checks, here first: a check-in shown as done is one Google will take

    if (!ukMobile(form.mobile)) return showErr(err, 'Please enter a valid UK mobile number (07…).');
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(form.email.trim())) return showErr(err, 'Please enter a valid email.');
    if (!form.over18) return showErr(err, 'Please answer whether you are 18 or over.');
    if (!booker && !unsure && typed.length < 2) return showErr(err, 'Who booked you in? Tap their name from the list as you type, or tick "I\'m not sure".');
    if (!form.rtw) return showErr(err, 'Please choose your right to work status.');
    if (!document.getElementById('exp').hidden && !form.visa_expiry) return showErr(err, 'Please add your visa expiry date.');

      e.preventDefault();
      const err = document.getElementById('err');
      const missing = EVAL.filter(q => !q.optional && (!q.showIf || q.showIf(a)) && !String(a[q.k] || '').trim());
      if (missing.length) {
        showErr(err, 'Nearly there! ' + missing.length + ' to go. Missing: "' + missing[0].t + '"');
        missing.forEach(q => { const c = f.querySelector('.qwrap[data-k="' + q.k + '"]'); if (c) c.classList.add('miss'); });
        const w = f.querySelector('.qwrap[data-k="' + missing[0].k + '"]'); if (w) w.scrollIntoView({ block: 'center', behavior: 'smooth' });
        return;
      }
      EVAL.forEach(q => { if (q.showIf && !q.showIf(a)) delete a[q.k]; });  // e.g. typed a detail, then changed to "No"
      const id = C.rec.id;
      store.set('evaldraft_' + id, a);  // stays until Google has it
      C.rec.evalDone = true; store.set('cand', C.rec);
      renderDone(edit ? 'updated' : 'new', true);
      sendSoon('eval_' + id, 'submitEval', { id: id, resume: C.rec.resume, answers: a, edit: !!edit }, r => {
        if (r.status === 'already' && $app.dataset.screen === 'done') renderDone('already', false);
      }, ex => {
        if (C.rec && C.rec.id === id) { C.rec.evalDone = false; store.set('cand', C.rec); }
        const card = $app.dataset.screen === 'done' && $app.querySelector('.c-done');

        card.insertAdjacentHTML('afterbegin', '<div class="err">Your answers didn\'t send: ' + h(ex.message) + '</div><button class="btn block" id="evretry">Try again (your answers are saved)</button>');
        document.getElementById('evretry').onclick = () => renderEval(edit);
      });
    });
  };
  draw();

  if (!presenterOpts().length) callRetry('publicConfig', {}, null, 2).then(cfg => {
    store.set('cfg', cfg); C.cfg = Object.assign(C.cfg || {}, cfg);
    if (presenterOpts().length && $app.dataset.screen === 'eval' && document.getElementById('f')) { const y = window.scrollY; draw(); window.scrollTo(0, y); }
  }).catch(() => {});
}

// Swipe a candidate left to reveal Call / WhatsApp
function closeSwipes(except) { document.querySelectorAll('.swipe.open').forEach(x => { if (x !== except) { x.classList.remove('open'); x.querySelector('.item').style.transform = ''; } }); }
function bindSwipe(sw) {
  if (sw._wired) return; sw._wired = 1;
  const it = sw.querySelector('.item'); const W = 152;
  let x0 = 0, y0 = 0, dx = 0, mode = '';
  sw.addEventListener('touchstart', e => { x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; mode = ''; it.style.transition = 'none'; }, { passive: true });
  sw.addEventListener('touchmove', e => {
    const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
    if (!mode) mode = Math.abs(mx) > 8 && Math.abs(mx) > Math.abs(my) ? 'x' : (Math.abs(my) > 8 ? 'y' : '');
    if (mode !== 'x') return;
    dx = Math.max(-W - 20, Math.min(0, mx + (sw.classList.contains('open') ? -W : 0)));
    it.style.transform = 'translateX(' + dx + 'px)';
  }, { passive: true });
  sw.addEventListener('touchend', () => {
    it.style.transition = '';
    if (mode !== 'x') return;
    if (dx < -W / 2) { closeSwipes(sw); sw.classList.add('open'); it.style.transform = 'translateX(' + (-W) + 'px)'; }
    else { sw.classList.remove('open'); it.style.transform = ''; }
  });
}

          rows: JLBulletin.dailyRows(n.today.map(r => Object.assign({}, r, { bar: !!barSet()[r.key] })), n.noBooker) }
      : { target: n.target, rows: JLBulletin.weeklyRows(n.week, n.target), msgs: S.bull.msgs };
    return JLBulletin.load('').then(assets => new Promise(res => {
      const cv = JLBulletin.draw(document.createElement('canvas'), kind, data, opts, assets);
      cv.toBlob(blob => {
        if (S.view !== 'bulletin' || S.bullTok !== tok) return res();
        const name = kind === 'daily' ? 'JL-stats-' + day + '.jpg' : 'JL-top5-' + we + '.jpg';

        document.getElementById('bload').hidden = true;

      }, 'image/jpeg', 0.92);
    }));
  };
  let timer = null;
  const redraw = () => { clearTimeout(timer); timer = setTimeout(draw, 250); };
  draw();
  document.getElementById('bshare').onclick = () => {
    const f = S.bullFile;

      navigator.share({ files: [f] }).catch(e => { if (e && e.name !== 'AbortError') toast('Couldn\'t open sharing. Use Save image instead.'); });
    } else { document.getElementById('bsave').click(); toast('Saved. Open WhatsApp and attach the image.'); }
  };
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.oninput = () => { fn(el.value); redraw(); }; };
  on('btag', v => { S.bull.tagline = v; S.bull.edited = true; });
  [0, 1, 2].forEach(i => on('bm' + i, v => { S.bull.msgs[i] = v; S.bull.edited = true; }));
  [['bmis', 'mission'], ['bhash', 'tag'], ['bcash', 'cash']].forEach(f => on(f[0], v => { const x = store.get('bullOpts') || {}; x[f[1]] = v.trim(); store.set('bullOpts', x); }));
  page.querySelectorAll('#bbar .chip').forEach(c => {
    c.onclick = () => {

      Object.keys(all).sort().slice(0, -14).forEach(x => { delete all[x]; });  // keep the last 2 weeks only
      store.set('barTags', all); c.classList.toggle('on', all[day][k]); redraw();
    };
  });
  document.getElementById('breset').onclick = () => { S.bull = null; store.del('bullOpts'); const t = store.get('barTags') || {}; delete t[day]; store.set('barTags', t); render(); };
}
function bindBullSeg(page, day) {
  const go = (d, k) => { S.params = { day: d, kind: k || S.params.kind }; hist('replace', { v: 'bulletin', p: S.params }); render(); };
  page.querySelectorAll('#bkind button').forEach(b => { b.onclick = () => { if (!b.classList.contains('on')) go(day, b.dataset.k); }; });
  page.querySelectorAll('.daybar .dchip').forEach(b => { b.onclick = () => { if (!b.classList.contains('on')) go(b.dataset.d); }; });
  // Week arrows keep the same weekday (Friday → last Friday), never past today
  const wk = n => { let d = addDays(day, n); if (d > S.me.today) d = S.me.today; if (D(d).getUTCDay() === 0) d = addDays(d, -2); else if (D(d).getUTCDay() === 6) d = addDays(d, -1); go(d); };
  const p = page.querySelector('#bwprev'), n = page.querySelector('#bwnext');

  if (n) n.onclick = () => wk(7);

}

const AV_DAY = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

function avIn(w) { return String(w || '').split('').filter(x => x === 'I').length; }

function avCamp(r) { return r.campaign === 'HF' || r.campaign === 'FR' ? r.campaign : r.company === 'JUSS' ? 'HF' : 'FR'; }
function avOrder(rows) { return rows.slice().sort((a, b) => (avCamp(a) === 'HF' ? 0 : 1) - (avCamp(b) === 'HF' ? 0 : 1) || a.day1_date.localeCompare(b.day1_date) || a.full_name.localeCompare(b.full_name)); }

/** The phone's photo, cropped square and made small (360 px JPEG, under ~45k characters) so it's quick to save and to load. */
function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const side = Math.min(img.naturalWidth, img.naturalHeight), cv = document.createElement('canvas'), SZ = 360;
      cv.width = SZ; cv.height = SZ;
      cv.getContext('2d').drawImage(img, (img.naturalWidth - side) / 2, (img.naturalHeight - side) / 2, side, side, 0, 0, SZ, SZ);
      let q = 0.82, data = cv.toDataURL('image/jpeg', q);
      while (data.length > 45000 && q > 0.3) { q -= 0.08; data = cv.toDataURL('image/jpeg', q); }
      res(data);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}

/** Slide-ready PNG: title, big QR, caption. Same code forever, so it can live on the slides. */
function slideQR(url, title, caption, colour) {
  const qr = qrcode(0, 'M'); qr.addData(url); qr.make();
  const n = qr.getModuleCount(), cell = Math.floor(860 / (n + 4)), size = cell * (n + 4);
  const W = 1000, H = size + 300;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const x = cv.getContext('2d');
  x.fillStyle = '#fff'; x.fillRect(0, 0, W, H);
  x.fillStyle = colour; x.fillRect(0, 0, W, 150);
  x.fillStyle = '#fff'; x.font = '800 64px -apple-system, Segoe UI, Roboto, Arial'; x.textAlign = 'center';
  x.fillText(title, W / 2, 98);
  const ox = Math.floor((W - size) / 2), oy = 170;
  x.fillStyle = '#111';
  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (qr.isDark(r, c)) x.fillRect(ox + (c + 2) * cell, oy + (r + 2) * cell, cell, cell);
  x.fillStyle = '#2F2F38'; x.font = '600 38px -apple-system, Segoe UI, Roboto, Arial';
  x.fillText(caption, W / 2, oy + size + 80);
  return cv.toDataURL('image/png');
}

function leakOf(c, today, days) {
  const from = addDays(today, -((days || 14) - 1));

/** Make `from` look like `to`, keeping every node that's already right (and its taps / listeners). Rows match by data-id. */
function morph(from, to, inner) {
  if (!inner) {  // the page itself keeps its own id / classes; only what's inside it changes
    const at = from.attributes, bt = to.attributes;
    for (let i = at.length - 1; i >= 0; i--) if (!to.hasAttribute(at[i].name)) from.removeAttribute(at[i].name);
    for (let i = 0; i < bt.length; i++) if (from.getAttribute(bt[i].name) !== bt[i].value) from.setAttribute(bt[i].name, bt[i].value);
  }
  const a = Array.from(from.childNodes), b = Array.from(to.childNodes);
  b.forEach((n, i) => {
    const o = a[i];
    if (!o) return from.appendChild(n);
    if (o.isEqualNode(n)) return;
    const idOf = x => x.nodeType === 1 ? x.getAttribute('data-id') || x.getAttribute('data-for') || '' : '';
    if (o.nodeType !== n.nodeType || o.nodeName !== n.nodeName || idOf(o) !== idOf(n)) return from.replaceChild(n, o);
    if (o.nodeType !== 1) { o.nodeValue = n.nodeValue; return; }
    morph(o, n);
  });
  for (let i = b.length; i < a.length; i++) from.removeChild(a[i]);

      case 'w': g.lineWidth = Math.max(0.5, Number(st[st.length - 1]) * k); break;

      case 'm': case 'l': path.push([t].concat(st.slice(-2).map(Number))); break;

/** Phone: the share sheet (Print, Save to Files, WhatsApp, AirDrop). Computer: a download. */
/** A PDF button: the PDF on screen first (every page), then "Share / Save" sends it to the phone's Share sheet. */
function savePdf(bytes, name) {

    '<div class="sheet-h"><div style="min-width:0"><div class="label muted">Preview · ' + bytes.pages.length + ' page' + (bytes.pages.length === 1 ? '' : 's') + '</div><div class="display">' + h(name.replace(/\.pdf$/i, '')) + '</div></div></div>' +
    '<div class="pdfpages"></div>' +
    '<div class="bullbtns pdfbtns"><button class="btn" id="pdfgo">📤 Share / Save</button><button class="btn ghost" id="pdfx">Close</button></div></div>';
  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  const box = back.querySelector('.pdfpages'), dpr = Math.min(2, window.devicePixelRatio || 1), wpx = Math.max(280, box.clientWidth || 340);
  bytes.pages.forEach(stream => {
    const cv = document.createElement('canvas');
    cv.width = Math.round(wpx * dpr); cv.height = Math.round(cv.width * 841.89 / 595.28);
    box.appendChild(cv);

/** The PDF to the phone's Share sheet (save to Files, WhatsApp, email…), or a download where there isn't one. */
function sharePdf(bytes, name) {
  const blob = new Blob([bytes], { type: 'application/pdf' });
  let file = null; try { file = new File([blob], name, { type: 'application/pdf' }); } catch (e) { /* old browser */ }
  if (file && navigator.canShare && navigator.canShare({ files: [file] })) { navigator.share({ files: [file], title: name }).catch(() => {}); return; }
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}

// ───── Instant saves: change shows straight away, syncs in the background, retries when signal returns ─────
let FLUSHING = false;
function outbox() { return store.get('outbox') || []; }
function setOutbox(q) { store.set('outbox', q); showPending(); }
function pendingIds() { return outbox().map(o => o.id); }
function whenNotTyping(fn) {
  const later = () => setTimeout(() => { if (!isTyping()) { document.removeEventListener('focusout', later); fn(); } }, 50);
  document.addEventListener('focusout', later);
}
function isTyping() { return document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName); }
function londonNow() {
  const p = new Intl.DateTimeFormat('en-GB', { timeZone: 'Europe/London', year: 'numeric', month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit', hourCycle: 'h23' })
    .formatToParts(new Date()).reduce((a, x) => (a[x.type] = x.value, a), {});
  return p.year + '-' + p.month + '-' + p.day + ' ' + p.hour + ':' + p.minute;
}
function showPending() {
  const n = outbox().length;
  const el = document.getElementById('sync'); if (el) el.classList.toggle('on', S.syncing > 0 || n > 0);
  refreshBars();
}
function queueSave(action, payload, local, msg) {
  local._pending = true;
  chaseKeep(local);
  const d = S.data[local.week_ending];
  if (d) { const i = d.items.findIndex(x => x.id === local.id); if (i >= 0) d.items[i] = local; else d.items.push(local); }
  saveCache();
  setOutbox(outbox().concat([{ action: action, payload: payload, id: local.id, t: Date.now() }]));
  toast(msg);
  if (S.view === 'cand' && S.params.id === local.id) renderCandidate(local, true);
  flush();
}
function flush() {
  if (FLUSHING || !S.token) return;
  const op = outbox()[0]; if (!op) return;
  FLUSHING = true;
  call(op.action, op.payload).then(nc => {
    setOutbox(outbox().slice(1));
    FLUSHING = false;
    if (pendingIds().indexOf(nc.id) < 0) {
      upsert(nc);
      const show = () => {
        if (S.view === 'cand' && S.params.id === nc.id) { if (S.candDirty !== nc.id) renderCandidate(findCand(nc.id) || nc, true); }
        else if (['today', 'mine', 'all'].indexOf(S.view) >= 0) render(true);  // the "⏳ Syncing" tag on the card goes away
      };
      whenCalm('saved:' + nc.id, show);
    }
    flush();
  }, err => {
    FLUSHING = false;
    if (err.retry || /connection|network|fetch/i.test(err.message)) { showPending(); return; }  // no signal or Google busy: keep it, retry on the next tick
    setOutbox(outbox().slice(1));
    toast('Not saved: ' + err.message);
    call('getCandidate', { id: op.id }).then(nc => { upsert(nc); if (S.view === 'cand' && S.params.id === nc.id) renderCandidate(nc, true); }).catch(() => {});
    flush();
  });
}

function cbPicks() {
  const now = londonNow(), today = now.slice(0, 10), mins = +now.slice(11, 13) * 60 + +now.slice(14, 16), t = addDays(today, 1);
  const hm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
  const in1 = Math.ceil((mins + 60) / 15) * 15, out = [];
  if (in1 <= 21 * 60) out.push([today + ' ' + hm(in1), 'In 1 hour · ' + fmt12(hm(in1))]);
  if (mins < 17 * 60) out.push([today + ' 18:00', 'Today 6pm']);
  return out.concat([[t + ' 12:00', 'Tomorrow 12pm'], [t + ' 18:00', 'Tomorrow 6pm'], ['pick', 'Another day / time…']]);
}
function cbPicker(c) {
  const picks = cbPicks(), cur = c.outcome === 'Thinking it over' ? c.callback_at || '' : '';
  const sel = !cur ? '' : picks.some(p => p[0] === cur) ? cur : 'pick', tmr = addDays(londonNow().slice(0, 10), 1);
  return '<label class="q">When did they ask us to call back?</label>' + chips('cb', picks, sel) +
    '<div class="cbpick"' + (sel === 'pick' ? '' : ' hidden') + '><input type="date" class="cbd" value="' + h(cur ? cur.slice(0, 10) : tmr) + '"><input type="time" class="cbt" value="' + h(cur ? cur.slice(11, 16) : '18:00') + '"></div>' +
    '<div class="help">🔔 You get a reminder on your phone at that time. Then send them the "speak soon" message with it.</div>';
}
function cbVal(root) {
  const v = chipVal(root, 'cb'); if (v !== 'pick') return v || '';
  const d = root.querySelector('.cbd').value, t = root.querySelector('.cbt').value;
  return d && t ? d + ' ' + t.slice(0, 5) : '';
}
function submitOutcome(c, payload, errEl) {
  if (!payload.outcome) { showErr(errEl, 'Choose an outcome.'); return false; }
  if (payload.outcome === 'Thinking it over' && !/^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$/.test(payload.callback_at || '')) { showErr(errEl, 'When did they ask us to call back? Pick a time.'); return false; }
  if (payload.outcome === 'Academy booked' && !/^\d{4}-\d{2}-\d{2}$/.test(payload.academy_date)) { showErr(errEl, 'Pick the BA Academy Day 1 date.'); return false; }
  const acad = payload.outcome === 'Academy booked' ? payload.academy_date : '';
  const now = londonNow();
  const local = Object.assign({}, c, {
    outcome: payload.outcome, academy_date: acad, outcome_notes: payload.outcome_notes, outcome_by: S.me.user.name, outcome_at: now,
    callback_at: payload.outcome === 'Thinking it over' ? payload.callback_at : '',
    outcome_late: now > c.deadline ? 'TRUE' : '', academy_confirmed_at: acad === c.academy_date ? c.academy_confirmed_at : '',
    day1_status: acad === c.academy_date ? c.day1_status : '',
    admin_status: acad && (c.rag === 'R' || c.rag === 'W' || c.repeat_block) && !isAdmin() && c.admin_status !== 'approved' ? 'pending' : (acad ? c.admin_status : (c.admin_status === 'pending' ? '' : c.admin_status)),
  });
  queueSave('saveOutcome', payload, local, local.outcome_late ? 'Saved — flagged late' : 'Outcome saved ✓');
  return true;
}

// ───── Candidate page: summary on top, section tabs that stay pinned, the part you act on first ─────
function spy() {
  const bar = S.view === 'cand' && document.getElementById('jump'); if (!bar) return;
  const secs = Array.from(document.querySelectorAll('.csec')); if (!secs.length) return;
  let cur = secs[0];
  secs.forEach(s => { if (s.getBoundingClientRect().top <= 170) cur = s; });
  if (window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 4) cur = secs[secs.length - 1];
  let moved = null;
  bar.querySelectorAll('button').forEach(b => { const on = b.dataset.go === cur.id; if (on && !b.classList.contains('on')) moved = b; b.classList.toggle('on', on); });
  if (moved && (moved.offsetLeft < bar.scrollLeft || moved.offsetLeft + moved.offsetWidth > bar.scrollLeft + bar.clientWidth)) bar.scrollTo({ left: moved.offsetLeft - 16, behavior: REDUCED ? 'auto' : 'smooth' });
}
window.addEventListener('scroll', () => { if (!spy.raf) spy.raf = requestAnimationFrame(() => { spy.raf = 0; spy(); }); }, { passive: true });

      qa(Q('q2_stood_out'), c.q2_stood_out) + qa(Q('q8_resilience'), c.q8_resilience) + qa(Q('q9_results_paid'), c.q9_results_paid) +
      (c.q9_results_detail ? qa(Q('q9_results_detail'), c.q9_results_detail) : '') +
      qa(Q('q10_door'), c.q10_door) + qa(Q('q11_coach'), c.q11_coach) +
      (c.q12_bdp_why ? qa(Q('q12_bdp_why'), c.q12_bdp_why) : '') +
      (isAdmin() ? qa(Q('q13_unspent') + ' (admin only)', c.q13_unspent) : '') + qa(Q('q14_questions'), c.q14_questions)
    : '<p class="muted">' + (c.non_qual ? 'Non-qualifier: no evaluation form.' : 'Not submitted yet.') + '</p>';
  const academyDefault = c.academy_date || nextMonday(S.me.today);
  const offerReady = c.outcome === 'Academy booked' && c.admin_status !== 'pending' && c.admin_status !== 'rejected';
  const waMain = canOutcome && offerReady ? msgUrl(c, msgAcademy(c)) : canThank() ? msgUrl(c, msgThanks(c)) : msgUrl(c, '');


  // Summary: who, how they did, one-tap contact
  const summary = '<div class="profile">' + FX + avatar(c, 'xl') + '<h1>' + h(c.full_name) + '</h1>' +
    '<div class="muted small">Attended ' + fmt(c.attended_date) + ' · ' + (c.booker_name ? 'booked by <b>' + h(c.booker_name) + '</b> <span class="co ' + h(c.company) + '">' + h(c.company) + '</span>' +
      (c.booker_typed && normName(c.booker_typed) !== normName(c.booker_name) ? ' <span class="small">(they said "' + h(c.booker_typed) + '")</span>' : '') : '<b>booker not confirmed</b>' + (c.booker_typed ? ' ("' + h(c.booker_typed) + '")' : '')) + '</div>' +
    presentedLine(c) + day1SentLine(c) +
    (c.stars ? '<div class="stars-lg">' + '★'.repeat(Number(c.stars)) + '<span>' + '★'.repeat(5 - Number(c.stars)) + '</span></div>' : '') +
    (c.p_interesting ? '<div class="icebreak">💡 ' + h(c.p_interesting) + '</div>' : '') +
    '<div class="pills center-pills">' + nqPill(c) + statusPill(c) + (c._pending ? '<span class="pill">⏳ Syncing…</span>' : '') + '</div>' +
    (locked ? '' : '<div class="actions"><a href="tel:' + h(c.mobile) + '">' + icon('phone') + '<span>Call</span></a>' +
    '<a href="' + h(waMain) + '" target="_blank" rel="noopener">' + icon('chat') + '<span>' + chanName(c) + '</span></a>' +
    '<a href="mailto:' + h(c.email) + '">' + icon('mail') + '<span>Email</span></a></div>') +
    (flags.length || nqBan ? '<div class="flags">' + nqBan + flags.map(f => '<div class="flag ' + f.level + '">' + h(f.text) + '</div>').join('') + '</div>' : '') + '</div>';

  // In the room (presenter)
  const pres = presCard(c, canNotes);

  // Call outcome (booker / admin)
  let out = '<div class="card" id="out">';
  if (c.outcome) {
    out += '<p>' + statusPill(c) + (c.academy_date ? ' <b>Day 1: ' + fmtLong(c.academy_date) + '</b>' : '') + '</p>' +
      (callLog(c).length > 1 ? callLogHtml(c) : '<p class="small muted" id="logged">Logged ' + fmtTs(c.outcome_at) + ' by ' + h(c.outcome_by) + (c.outcome_late ? ' · <b style="color:var(--amber)">LATE</b>' : '') + '</p>' +
      (c.outcome_notes ? '<p style="white-space:pre-wrap">' + h(c.outcome_notes) + '</p>' : '')) +
      (c.outcome === 'Academy booked' && offerReady ? (c.academy_confirmed_at
        ? '<div class="flag green">✅ ' + h(c.first_name) + ' confirmed Day 1 on their welcome page · ' + fmtTs(c.academy_confirmed_at) + '</div>'
        : '<div class="flag amber">⏳ Not confirmed yet. They confirm by tapping the link in your WhatsApp.</div>') : '') +
      (c.admin_status === 'pending' ? '<div class="flag red">Waiting for admin to approve this Academy booking (presenter marked RED or previously not suitable).</div>' : '') +
      (c.admin_status === 'approved' ? '<div class="flag green">Approved by ' + h(c.admin_by) + (c.admin_note ? ': ' + h(c.admin_note) : '') + '</div>' : '') +
      (c.admin_status === 'rejected' ? '<div class="flag red">Rejected by ' + h(c.admin_by) + (c.admin_note ? ': ' + h(c.admin_note) : '') + '</div>' : '') +
      sentList(c);
    if (canOutcome) out += '<hr>';
  } else if (!canOutcome) out += '<p class="muted">' + (walk ? '🚶 Not needed: they walked out of the presentation. No call, messages or BA Academy booking.' : 'Not logged yet.') + '</p>';
  if (canOutcome) {
    out += '<label class="q" style="margin-top:0">' + (c.outcome ? 'Update outcome' : 'How did the call go?') + '</label>' +
      chips('outcome', walk ? S.me.outcomes.filter(o => o !== 'Academy booked') : S.me.outcomes, c.outcome, true) +
      '<div id="acad"' + (c.outcome === 'Academy booked' ? '' : ' hidden') + '><label class="q">BA Academy Day 1 date</label><input type="date" id="adate" value="' + h(academyDefault) + '"></div>' +
      '<div id="cbk"' + (c.outcome === 'Thinking it over' ? '' : ' hidden') + '>' + cbPicker(c) + '</div>' +
      '<label class="q">Notes from the call</label><textarea id="onotes" placeholder="Anything the team should know">' + h(c.outcome_notes) + '</textarea>' +
      '<div id="oerr"></div><div class="dock"><button class="btn block" id="saveout">Save outcome</button></div>' +
      '<p class="small muted center">Logging after the deadline is allowed but shows as late.</p>';
  }
  out += '</div>';

  // WhatsApp, ready to send
  const wa = [];
  // No thank-you for a walk out
  if (canThank() && !walk) wa.push(sendButtons(c, 'thanks', '💬 Send thank-you message' + (c.non_qual ? ' (non-qualifier)' : ''), msgThanks(c)) +
    (c.thanks_sent_at ? '<p class="small muted center sentby" data-sent="thanks">✓ ' + cap1(sentBy(c.thanks_by, c.thanks_sent_at, c.thanks_via, c.thanks_co)) + '</p>' : ''));
  const thanksFlag = canThank() || walk ? '' : c.thanks_sent_at
    ? '<div class="flag green">💬 Thank-you ' + sentBy(c.thanks_by, c.thanks_sent_at, c.thanks_via, c.thanks_co) + '</div>'
    : '<div class="flag amber">💬 Thank-you not sent yet · ' + h(thanksName(thanksCo(c))) + ' sends it</div>';
  if (canOutcome && offerReady && !c.welcome_url && c._pending) wa.push('<div class="flag amber"><span class="spinner sm inline"></span> Saving to Google… the 🎉 congratulations button appears here in a few seconds.</div>');
  if (canOutcome && offerReady && (c.welcome_url || !c._pending)) wa.push(sendButtons(c, 'offer', '🎉 Send BA Academy Day 1 details (' + brandCo(c) + ')', msgAcademy(c)) +
    (c.offer_sent_at ? '<p class="small muted center sentby" data-sent="offer">✓ ' + cap1(offerBy(c)) + '</p>' : '') +
    (c.welcome_url ? '<a class="btn ghost sm" target="_blank" rel="noopener" href="' + h(welcomeLink(c)) + '">👀 Preview their welcome page</a>' : ''));
  if (canOutcome && c.outcome === 'No answer') wa.push(sendButtons(c, 'noanswer', '📞 Send "we tried calling you" message', msgNoAnswer(c)));
  if (canOutcome && c.outcome === 'Thinking it over') wa.push(sendButtons(c, 'thinking', '🔁 Send "speak soon" + call-back time', msgThinking(c)));
  const noWa = c.no_whatsapp && !walk ? '<div class="flag amber">📵 Not on WhatsApp: message them by text (or email)</div>' : '';
  const waCard = walk && !wa.length ? '' : '<div class="card wa-grid" id="wacard">' + noWa + thanksFlag + wa.join('') + (wa.length ? '<p class="small muted center" style="margin:0">' + (canPickBrand() ? 'Tap <b>LINK</b> or <b>JUSS</b>: opens ' : 'Opens ') + ({ sms: 'your Messages app', email: 'your email' }[canPickBrand() ? chanOf(c) : c.no_whatsapp ? 'sms' : ''] || 'WhatsApp') +
    (canPickBrand() ? ' with that company\'s message ready, signed by you.' : ' with the message ready, then just tap send.') + '</p>' : '') + '</div>';

  // Admin
  let adm = '';
  if (isAdmin()) {
    adm = '<div class="card">';
    if (c.admin_status === 'pending') {
      adm += '<p><b>Decision needed:</b> ' + h(c.outcome_by) + ' wants to book BA Academy.</p><input type="text" id="anote" placeholder="Note (optional)">' +
        '<div class="row" style="margin-top:8px"><button class="btn green grow" id="approve">Approve</button><button class="btn red grow" id="reject">Reject</button></div><hr>';
    }
    const byAdmin = (S.users || []).some(u => u.id === c.booker_id && u.roles.indexOf('admin') >= 0);
    adm += '<p><b>Recruitment incentive:</b> ' + (byAdmin ? '<span class="muted">Booked by ' + h(c.booker_name) + ' (admin), so no incentive</span>'
      : c.pay_reason ? '<span style="color:var(--red)">Doesn\'t count — ' + h(c.pay_reason) + '</span>' : '<span style="color:var(--green)">Counts towards ' + h(c.booker_name || 'booker') + '\'s net ' + S.me.payTarget + '</span>') + '</p>' +
      (byAdmin ? '' : c.pay_excluded
        ? '<button class="btn ghost sm" id="incl">Count it again</button>'
        : '<div class="row"><input type="text" id="exr" placeholder="Reason, e.g. share code failed" style="flex:1"><button class="btn ghost sm" id="excl">Remove from incentive</button></div>') +
      '<hr><details class="fixel" id="fixnm"><summary><b>Fix their name</b></summary><label class="q">Full name</label><input type="text" id="fnname" value="' + h(c.full_name) + '">' +
        '<button class="btn ghost sm" id="fnsave" style="margin-top:10px">Save name</button></details>' +
      '<details class="fixel"' + (c.non_qual ? ' open' : '') + '><summary><b>' + (c.non_qual ? 'Ticked the wrong answer at check-in?' : 'Fix their check-in answers') + '</b></summary>' +
        '<label class="q">18 or over</label><select id="fx18">' + ['Yes', 'No'].map(v => '<option' + (c.over18 === v ? ' selected' : '') + '>' + v + '</option>').join('') + '</select>' +
        '<label class="q">Right to work</label><select id="fxrtw">' + (S.me.rtw || []).map(r => '<option' + (c.rtw === r.label ? ' selected' : '') + '>' + h(r.label) + '</option>').join('') + '</select>' +
        '<label class="q">Visa expiry (visas only)</label><input type="date" id="fxexp" value="' + h(c.visa_expiry) + '">' +
        '<button class="btn ghost sm" id="fxsave" style="margin-top:10px">Save answers</button></details>' +
      '<hr><label class="q" style="margin-top:0">Booker</label><div class="row"><select id="rb" style="flex:1"><option value="">Choose booker…</option>' +
      (S.users || []).filter(u => u.active && (u.roles.indexOf('booker') >= 0 || u.roles.indexOf('admin') >= 0)).map(u => '<option value="' + h(u.id) + '"' + (u.id === c.booker_id ? ' selected' : '') + '>' + h(u.name) + ' (' + h(u.company) + ')</option>').join('') +
      '<option value="__new">＋ Someone not on the list…</option></select><button class="btn ghost sm" id="reas">Save</button></div>' +
      '<div id="nbk" hidden><label class="q">Their name</label><input type="text" id="nbkn" value="' + h(c.booker_id ? '' : c.booker_typed) + '" placeholder="First and last name">' +
      '<label class="q">Company</label>' + chips('nbkco', ['LINK', 'JUSS'], 'LINK') +
      '<div class="help" style="margin-top:6px">Added to the team by name: credited on the bulletin and incentive now. Add their email in Team later so they can log in.</div>' +
      '<button class="btn block" id="nbksave" style="margin-top:10px">Add and credit them</button><div id="nbksim"></div></div></div>';
  }

  // Sections, in the order this person works through them
  const SEC = {
    out: ['Outcome', '<b>Call outcome</b><span>' + ((c.non_qual || c.rag === 'W') && !c.outcome ? 'not needed' : 'due ' + fmtTs(c.deadline)) + '</span>', out + (canOutcome ? waCard : '')],
    pres: ['Appt Feedback', '<b>Appt feedback</b>', pres + (canOutcome ? '' : waCard)],
    ev: ['Evaluation', '<b>Evaluation</b>' + (c.eval_at ? '<span>' + fmtTs(c.eval_at) + '</span>' : ''), '<div class="card">' + evalHtml + '</div>'],
    ci: ['Details', '<b>Check-in</b>', '<div class="card"><dl class="kv">' + kv('Mobile', locked ? '🔒 Hidden: walked out' : c.mobile) + kv('Email', c.email) + kv('18 or over', c.over18) + kv('Right to work', c.rtw) +
      kv('Visa expiry', c.visa_expiry ? fmt(c.visa_expiry) : '') + kv('Found us via', c.source) + kv('Typed booker', c.booker_typed) + kv('Checked in', fmtTs(c.created_at)) + '</dl></div>'],
    adm: ['Admin', '<b>Admin</b>', adm],
  };
  // Same order for everyone, the order they work through it: who they are → how the appointment went → their answers → the call
  const order = ['ci', 'pres', 'ev', 'out'].concat(isAdmin() ? ['adm'] : []);
  const onb = isAdmin() && offerReady && !c.limited ? onboardCard(c) : '';
  const html = summary + onb +
    '<nav class="jump' + (order.length > 4 ? ' five' : '') + '" id="jump"><div class="jump-in">' + order.map((k, i) => '<button type="button" data-go="sec-' + k + '"' + (i ? '' : ' class="on"') + '>' + SEC[k][0] + '</button>').join('') + '</div></nav>' +
    order.map(k => '<section class="csec" id="sec-' + k + '"><div class="section-h">' + SEC[k][1] + '</div>' + SEC[k][2] + '</section>').join('');

  paint(c.first_name, html, quiet, true);
  if (onb) bindOnboard(c);
  document.querySelectorAll('#jump button').forEach(b => {
    b.onclick = () => { const s = document.getElementById(b.dataset.go); if (s) s.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'start' }); };
  });
  spy();

  if (canNotes) bindPres(c);
  if (canOutcome) {
    const outEl = document.getElementById('out');
    bindChips(outEl, (n, v) => {
      if (n === 'outcome') { document.getElementById('acad').hidden = v !== 'Academy booked'; document.getElementById('cbk').hidden = v !== 'Thinking it over'; }
      if (n === 'cb') outEl.querySelector('.cbpick').hidden = v !== 'pick';
    });
    document.getElementById('saveout').onclick = () => {
      if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
      submitOutcome(c, { id: c.id, outcome: chipVal(outEl, 'outcome'), academy_date: document.getElementById('adate').value, callback_at: cbVal(outEl), outcome_notes: document.getElementById('onotes').value }, document.getElementById('oerr'));
    };
  }
  document.querySelectorAll('a[data-kind]').forEach(a => {
    a.addEventListener('click', () => {
      const via = a.dataset.via || 'whatsapp', kind = a.dataset.kind;
      const sent = co => {
        let lc = findCand(c.id) || c;
        if (co && brandCo(lc) !== co) lc = pickBrand(lc, co);  // saved: their welcome page, welcome email and every message after follow it
        call('markSent', Object.assign({ id: c.id, kind: kind, via: via }, co ? { co: co } : {})).then(() => sentDone(c.id, kind), () => sentDone(c.id, kind));  // in the Log: who sent it, when
        if (kind === 'thanks' || kind === 'offer' || (via !== 'whatsapp' && !lc.no_whatsapp)) {
          lc = noteSent(c.id, kind, via, co) || lc;  // "✓ Sent by you · 16:03" shows when they come back from WhatsApp
          setTimeout(() => { if (S.view === 'cand' && S.params.id === c.id) renderCandidate(findCand(c.id) || lc, true); }, 800);
        }
      };
      sent(a.dataset.co || '');  // the recruitment team's LINK / JUSS buttons carry the company they tapped
    });
  });
  // "📱 Text" / "✉️ Email" under the LINK / JUSS buttons: send this way instead
  document.querySelectorAll('#wacard [data-chan]').forEach(b => { b.onclick = () => { (S.chan = S.chan || {})[c.id] = b.dataset.chan; renderCandidate(findCand(c.id) || c, true); }; });
  if (isAdmin()) {
    const dec = d => () => call('adminDecision', { id: c.id, decision: d, note: (document.getElementById('anote') || {}).value || '' }).then(nc => saved(nc, 'Decision saved ✓')).catch(x => toast(x.message));
    const ap = document.getElementById('approve'); if (ap) { ap.onclick = dec('approved'); document.getElementById('reject').onclick = dec('rejected'); }
    const ex = document.getElementById('excl');
    if (ex) ex.onclick = () => {
      const r = document.getElementById('exr').value.trim();
      if (!r) return toast('Add a reason first');
      call('setPayExcluded', { id: c.id, excluded: true, reason: r }).then(nc => saved(nc, 'Removed from the incentive count')).catch(x => toast(x.message));
    };
    const fn = document.getElementById('fnsave');
    if (fn) fn.onclick = () => call('fixName', { id: c.id, full_name: document.getElementById('fnname').value }).then(nc => saved(nc, 'Name saved ✓ ' + nc.full_name)).catch(x => toast(x.message));
    const fx = document.getElementById('fxsave');
    if (fx) fx.onclick = () => call('fixEligibility', { id: c.id, over18: document.getElementById('fx18').value, rtw: document.getElementById('fxrtw').value, visa_expiry: document.getElementById('fxexp').value })
      .then(nc => saved(nc, nc.non_qual ? 'Saved: still a non-qualifier' : 'Saved ✓ They can do the evaluation now')).catch(x => toast(x.message));
    const inc = document.getElementById('incl');
    if (inc) inc.onclick = () => call('setPayExcluded', { id: c.id, excluded: false }).then(nc => saved(nc, 'Counted again')).catch(x => toast(x.message));
    const rb = document.getElementById('rb'), nbk = document.getElementById('nbk');
    rb.onchange = () => { nbk.hidden = rb.value !== '__new'; document.getElementById('reas').hidden = rb.value === '__new'; };
    bindChips(nbk);
    document.getElementById('reas').onclick = e => {
      const v = rb.value, btn = e.currentTarget; if (!v || v === '__new') return toast('Choose a booker');
      if (v === c.booker_id) return toast('Already ' + (c.booker_name || 'their booker') + ' ✓');
      busy(btn, true, 'Saving…');
      call('reassignBooker', { id: c.id, booker_id: v }).then(nc => saved(nc, 'Booker updated ✓')).catch(x => { busy(btn, false); toast(x.message); });
    };
    const addNew = (btn, allowSimilar) => {
      const name = document.getElementById('nbkn').value.trim();
      if (name.split(/\s+/).length < 2) return toast('Add their first and last name');
      busy(btn, true, 'Adding…');
      call('saveUser', { allowSimilar: !!allowSimilar, user: { id: '', name: name, email: '', company: chipVal(nbk, 'nbkco') || 'LINK', roles: ['booker'], active: true } })
        .then(u2 => {
          S.users = (S.users || []).filter(o => o.id !== u2.id).concat([u2]).sort((a, b) => a.name.localeCompare(b.name)); saveCache();
          return call('reassignBooker', { id: c.id, booker_id: u2.id }).then(nc => {
            const t = normName(c.booker_typed), full = normName(u2.name), self = !c.booker_id && t && (t === full || t === full.split(' ')[0]);
            const more = Math.max(0, (u2.linked || 0) - (self ? 1 : 0));
            saved(nc, '✓ ' + u2.name.split(' ')[0] + ' added and credited' + (more ? ' (+' + more + ' more check-in' + (more > 1 ? 's' : '') + ' that typed their name)' : ''));
          });
        }).catch(x => {
          busy(btn, false);
          const sim = similarOf(x.message), box = document.getElementById('nbksim');
          if (!sim) return toast(x.message);
          // Nearly the same name as someone already on the team: almost always the same person
          box.innerHTML = '<div class="flag amber" style="margin-top:10px">' + similarText(sim) + ' Same person?' +
            '<button class="btn block" id="nbkuse" style="margin-top:8px">✅ Yes: credit ' + h(sim.name) + '</button>' +
            '<button class="btn ghost sm block" id="nbkany" style="margin-top:6px">Different person: add ' + h(name) + '</button></div>';
          document.getElementById('nbkuse').onclick = ev => { busy(ev.currentTarget, true, 'Saving…'); call('reassignBooker', { id: c.id, booker_id: sim.id }).then(nc => saved(nc, 'Booker updated ✓ ' + sim.name)).catch(y => toast(y.message)); };
          document.getElementById('nbkany').onclick = ev => addNew(ev.currentTarget, true);
        });
    };
    document.getElementById('nbksave').onclick = e => addNew(e.currentTarget);
  }
}

// ───────────── go ─────────────
if (BOOT.mode === 'staff') startStaff(); else startCandidate();
})();
</script>
