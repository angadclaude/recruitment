<style>
:root {
  color-scheme: only light;
  --card: #FFFFFF; --soft: #EEEBE6; --soft2: #E6E3DE; --tint: #FFEDE5; --teal-bg: #E6F4F6; --bar: rgba(255,255,255,.92);
  --orange: #F15A24;
  --orange-d: #D9481A;
  --ink: #2F2F38;
  --muted: #6B6B78;
  --line: #E6E4E0;
  --bg: #F6F4F1;
  --card: #FFFFFF;
  --teal: #2FB5C0;
  --red: #D93A3A;   --red-bg: #FDECEC;
  --amber: #C27A00; --amber-bg: var(--amber-bg);
  --green: #1E8E4E; --green-bg: #E5F6EC;
  --radius: 14px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink);
  font: 16px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
#app { max-width: 720px; margin: 0 auto; padding: 0 16px 96px; }
h1 { font-size: 24px; margin: 12px 0 4px; line-height: 1.2; }
h2 { font-size: 18px; margin: 0 0 10px; }
h3 { font-size: 15px; margin: 14px 0 6px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
p { margin: 6px 0; }
a { color: var(--orange-d); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.loading { padding: 64px 0; text-align: center; color: var(--muted); }

.brandbar { display: flex; align-items: center; justify-content: center; gap: 18px; padding: 18px 0 8px; }
.brandbar img { height: 54px; width: auto; border-radius: 8px; }
.brandbar .x { color: var(--muted); font-weight: 700; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin: 12px 0; }
.card.tight { padding: 12px 14px; }

label.q { display: block; font-weight: 600; margin: 18px 0 8px; }
label.q .req { color: var(--orange); }
.help { font-size: 13px; color: var(--muted); margin: -4px 0 8px; }
input[type=text], input[type=email], input[type=tel], input[type=date], select, textarea {
  width: 100%; font: inherit; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink);
}
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--orange); }
textarea { min-height: 90px; resize: vertical; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--card); border-radius: 999px; padding: 9px 14px; font: inherit; font-size: 15px; cursor: pointer; color: var(--ink); text-align: left; }
.chip.on { border-color: var(--orange); background: var(--tint); color: var(--orange-d); font-weight: 600; }
.chips.stack { flex-direction: column; }
.chips.stack .chip { border-radius: 12px; width: 100%; }
.scale { display: grid; grid-template-columns: repeat(10, 1fr); gap: 4px; }
.scale .chip { padding: 10px 0; text-align: center; border-radius: 10px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; padding: 13px 18px;
  font: inherit; font-weight: 700; cursor: pointer; background: var(--orange); color: #fff; text-decoration: none; }
.btn:active { transform: translateY(1px); }
.btn.block { width: 100%; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); }
.btn.wa { background: #1FA855; }
.btn.red { background: var(--red); }
.btn.green { background: var(--green); }
.btn.sm { padding: 8px 12px; font-size: 14px; border-radius: 10px; }
.btn[disabled] { opacity: .5; pointer-events: none; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.between { justify-content: space-between; }
.grow { flex: 1; }

.suggest { border: 1.5px solid var(--line); border-radius: 12px; margin-top: 6px; background: var(--card); overflow: hidden; }
.suggest button { display: flex; width: 100%; justify-content: space-between; padding: 12px 14px; border: 0; border-bottom: 1px solid var(--line); background: var(--card); font: inherit; cursor: pointer; text-align: left; }
.suggest button:last-child { border-bottom: 0; }
.picked { display: flex; justify-content: space-between; align-items: center; padding: 12px 14px; border: 1.5px solid var(--green); background: var(--green-bg); border-radius: 12px; font-weight: 600; }
.co { font-size: 11px; font-weight: 800; letter-spacing: .06em; padding: 2px 7px; border-radius: 6px; color: #fff; }
.co.LINK { background: var(--orange); }
.co.JUSS { background: linear-gradient(90deg, #E0864A, #2FB5C0); }

.check { display: flex; gap: 10px; align-items: flex-start; margin: 16px 0; font-size: 14px; }
.check input { width: 22px; height: 22px; margin-top: 1px; accent-color: var(--orange); flex: none; }

.err { background: var(--red-bg); color: var(--red); border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-weight: 600; }
.ok { background: var(--green-bg); color: var(--green); border-radius: 10px; padding: 10px 12px; margin: 12px 0; font-weight: 600; }
.big-emoji { font-size: 56px; text-align: center; margin: 24px 0 8px; }
.center { text-align: center; }

/* ladder */
.ladder { display: grid; gap: 4px; margin: 8px 0 4px; }
.ladder div { color: #fff; border-radius: 8px; padding: 7px 10px; font-size: 13px; font-weight: 700; }
.ladder span { font-weight: 400; opacity: .95; }

/* staff */
.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 10px 0 6px; display: flex; align-items: center; gap: 10px; }
.topbar img { height: 30px; border-radius: 5px; }
.topbar .who { margin-left: auto; font-size: 13px; color: var(--muted); text-align: right; }
.tabs { position: fixed; bottom: 0; left: 0; right: 0; z-index: 6; background: var(--card); border-top: 1px solid var(--line);
  display: flex; justify-content: center; padding-bottom: env(safe-area-inset-bottom); }
.tabs button { flex: 1; max-width: 140px; border: 0; background: none; padding: 10px 4px 12px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer; }
.tabs button b { display: block; font-size: 20px; line-height: 1.1; }
.tabs button.on { color: var(--orange-d); font-weight: 700; }

.list .item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; margin: 8px 0; cursor: pointer; }
.item .main { flex: 1; min-width: 0; }
.item .name { font-weight: 700; }
.item .sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 14px; height: 14px; border-radius: 50%; flex: none; background: #D5D3CF; }
.dot.G { background: var(--green); } .dot.A { background: #F2A900; } .dot.R { background: var(--red); }
.pill { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 999px; background: var(--soft); color: var(--ink); white-space: nowrap; }
.pill.red { background: var(--red-bg); color: var(--red); }
.pill.amber { background: var(--amber-bg); color: var(--amber); }
.pill.green { background: var(--green-bg); color: var(--green); }
.pill.blue { background: var(--teal-bg); color: #137C86; }
.datehead { margin: 18px 0 4px; font-weight: 800; font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }

.flags { display: grid; gap: 6px; }
.flag { border-radius: 10px; padding: 8px 12px; font-size: 14px; font-weight: 600; }
.flag.red { background: var(--red-bg); color: var(--red); }
.flag.amber { background: var(--amber-bg); color: var(--amber); }
.flag.green { background: var(--green-bg); color: var(--green); }

.kv { display: grid; grid-template-columns: 38% 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; font-weight: 600; word-break: break-word; }
.qa { border-top: 1px solid var(--line); padding: 10px 0; font-size: 14px; }
.qa:first-child { border-top: 0; }
.qa .qq { color: var(--muted); }
.qa .aa { font-weight: 600; white-space: pre-wrap; }

.stars button { font-size: 30px; background: none; border: 0; padding: 0 3px; cursor: pointer; color: #D5D3CF; }
.stars button.on { color: #F2A900; }
.rag { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rag button { padding: 12px 0; border-radius: 12px; border: 2px solid var(--line); background: var(--card); font: inherit; font-weight: 700; cursor: pointer; }
.rag button.G.on { background: var(--green); border-color: var(--green); color: #fff; }
.rag button.A.on { background: #F2A900; border-color: #F2A900; color: #fff; }
.rag button.R.on { background: var(--red); border-color: var(--red); color: #fff; }

.weeknav { display: flex; align-items: center; gap: 8px; margin: 6px 0 10px; }
.weeknav .lbl { flex: 1; text-align: center; font-weight: 700; }
.progress { height: 12px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 8px 0; }
.progress i { display: block; height: 100%; background: var(--orange); border-radius: 99px; }
.progress.done i { background: var(--green); }
.stat { font-size: 34px; font-weight: 800; line-height: 1; }

table.t { width: 100%; border-collapse: collapse; font-size: 14px; }
table.t th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 6px 4px; border-bottom: 1px solid var(--line); }
table.t td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.t td.n { text-align: center; }

.overlay { position: fixed; inset: 0; z-index: 20; background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
.overlay .qr { margin: 18px auto; padding: 12px; background: #fff; }
.overlay .close { position: absolute; top: 14px; right: 14px; }

.toast { position: fixed; left: 50%; bottom: 84px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 10px; z-index: 30; font-size: 14px; max-width: 90vw; }
.seg { display: inline-flex; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; }
.seg button { border: 0; background: var(--card); padding: 10px 16px; font: inherit; cursor: pointer; }
.seg button.on { background: var(--orange); color: #fff; font-weight: 700; }
.toggle { display: flex; align-items: center; gap: 10px; font-weight: 700; padding: 12px 14px; border-radius: 12px; border: 2px solid var(--line); background: var(--card); width: 100%; font: inherit; cursor: pointer; }
.toggle.on { border-color: var(--green); background: var(--green-bg); color: var(--green); }
/* welcome page */
.wl-hero { margin: 12px -16px 4px; padding: 26px 20px 22px; color: #fff; border-radius: 0 0 26px 26px; }
.wl-LINK .wl-hero { background: linear-gradient(135deg, #F15A24 0%, #F15A24 45%, #2F2F38 45.2%); }
.wl-JUSS .wl-hero { background: linear-gradient(120deg, #E0864A, #2FB5C0); }
.wl-hero h1 { font-size: 32px; margin: 14px 0 4px; }
.wl-hero p { margin: 0 0 12px; opacity: .95; }
.wl-logo { height: 58px; background: #fff; border-radius: 12px; padding: 6px; }
.wl-pill { display: inline-block; background: rgba(255,255,255,.95); color: var(--ink); font-weight: 800; padding: 7px 14px; border-radius: 999px; font-size: 14px; }
.wl-date { font-size: 24px; font-weight: 800; margin: 2px 0; }
.wl-time { font-weight: 700; color: var(--orange-d); margin-bottom: 4px; }
.wl-JUSS .wl-time { color: #137C86; }
.wl-alert { background: var(--amber-bg); border: 1.5px solid #F2C14E; color: #6B4A00; border-radius: 12px; padding: 12px 14px; margin: 12px 0; }
.wl-week .wk { display: flex; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
.wl-week .wk:first-child { border-top: 0; }
.wk-ic { font-size: 26px; width: 34px; text-align: center; }
.wk-d { font-size: 15px; } .wk-t { font-size: 13px; font-weight: 700; color: var(--muted); } .wk-x { font-size: 14px; margin-top: 2px; }
details.card summary { cursor: pointer; list-style: none; }
details.card summary::-webkit-details-marker { display: none; }
.wl-cta { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: linear-gradient(transparent, var(--bg) 30%); z-index: 8; }
.wl-cta > * { max-width: 688px; margin: 0 auto; }
.wl-btn { font-size: 18px; padding: 16px; box-shadow: 0 6px 18px rgba(241,90,36,.35); }
.wl-JUSS .wl-btn { background: linear-gradient(90deg, #E0864A, #2FB5C0); box-shadow: 0 6px 18px rgba(47,181,192,.35); }
.wl-done { background: var(--green); color: #fff; text-align: center; font-weight: 800; padding: 16px; border-radius: 12px; font-size: 17px; }
.confetti { position: fixed; top: -40px; font-size: 28px; z-index: 40; animation: fall 2.2s ease-in forwards; pointer-events: none; }
@keyframes fall { to { transform: translateY(110vh) rotate(540deg); opacity: .2; } }
.pushbar { background: var(--tint); border: 1.5px solid var(--orange); border-radius: 12px; padding: 12px 14px; margin: 8px 0; font-size: 14px; }
.bullbtns { display: flex; gap: 8px; margin: 12px 0 4px; }
.bullbtns .btn { flex: 1; padding: 12px 10px; }
.bullbtns #bshare { flex: 2; }
.bullseg { display: flex; margin: 4px 0 10px; }
.bullseg button { flex: 1; }
.bullimg { position: relative; min-height: 200px; margin-bottom: 12px; }
.bullimg img { width: 100%; display: block; border-radius: 12px; box-shadow: var(--shadow); }
.bullimg img:not([src]) { display: none; }
.bullimg .loading { padding: 60px 0; text-align: center; }
.bullopts { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
.appname { text-align: center; font-weight: 800; font-size: 20px; letter-spacing: .2px; margin: 4px 0 2px; color: var(--ink); }
.qrcard { text-align: center; }
.qrcard img { width: 100%; max-width: 360px; border: 1px solid var(--line); border-radius: 10px; }
hr { border: 0; border-top: 1px solid var(--line); margin: 14px 0; }

/* ══════════ App look (staff) ══════════ */
[hidden] { display: none !important; }
:root { --bg: #F3F1EE; --ink2: #1C1C24; --shadow: 0 1px 2px rgba(20,20,30,.05), 0 6px 20px rgba(20,20,30,.06); --radius: 18px; }
body { -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; }
.card { border: 0; box-shadow: var(--shadow); border-radius: var(--radius); }
.btn { border-radius: 14px; transition: transform .08s ease, filter .15s; }
.btn:active, .item:active, .chip:active, .iconbtn:active, .actions a:active { transform: scale(.97); }

.appbar { position: sticky; top: 0; z-index: 10; margin: 0 -16px; padding-top: env(safe-area-inset-top);
  background: var(--ink2); color: #fff; box-shadow: 0 4px 18px rgba(0,0,0,.15); }
.appbar::after { content: ''; display: block; height: 3px; background: linear-gradient(90deg, #F15A24, #E0864A 50%, #2FB5C0); }
.appbar-in { display: flex; align-items: center; gap: 10px; padding: 10px 16px; min-height: 56px; }
.ab-brand { display: flex; gap: 6px; }
.ab-brand img { height: 30px; border-radius: 7px; background: #fff; }
.ab-title { flex: 1; font-weight: 800; font-size: 19px; letter-spacing: -.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.avatar-btn { width: 36px; height: 36px; border-radius: 50%; border: 2px solid rgba(255,255,255,.25); background: #F15A24; color: #fff; font-weight: 800; font-size: 13px; cursor: pointer; }
.sync { width: 8px; height: 8px; border-radius: 50%; background: #2FB5C0; opacity: 0; transition: opacity .2s; }
.sync.on { opacity: 1; animation: pulse 1s infinite; }
@keyframes pulse { 50% { transform: scale(1.6); opacity: .4; } }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; border: 0; background: var(--card); box-shadow: var(--shadow); font-size: 22px; line-height: 1; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex: none; }
.iconbtn.light { background: rgba(255,255,255,.12); color: #fff; box-shadow: none; }
.iconbtn[disabled] { opacity: .35; }

#page { padding-top: 12px; }
.enter { animation: pageIn .2s ease-out; }
.enter-sub { animation: subIn .22s cubic-bezier(.2,.8,.2,1); }
@keyframes pageIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes subIn { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; display: flex; justify-content: center; gap: 4px;
  padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); background: var(--bar);
  backdrop-filter: saturate(180%) blur(14px); -webkit-backdrop-filter: saturate(180%) blur(14px); border-top: 1px solid rgba(0,0,0,.06); }
.tabbar button { flex: 1; max-width: 110px; border: 0; background: none; padding: 6px 2px 4px; border-radius: 14px; color: #8A8794;
  font: inherit; font-size: 11px; font-weight: 600; display: flex; flex-direction: column; align-items: center; gap: 2px; cursor: pointer; }
.tabbar button svg { padding: 3px 14px; border-radius: 999px; box-sizing: content-box; transition: background .2s; }
.tabbar button.on { color: var(--orange-d); }
.tabbar button.on svg { background: var(--tint); }

.seg-nav { display: flex; align-items: center; gap: 10px; margin: 2px 0 12px; }
.seg-nav .lbl { flex: 1; text-align: center; display: flex; flex-direction: column; line-height: 1.2; }
.seg-nav .lbl b { font-size: 16px; } .seg-nav .lbl span { font-size: 13px; color: var(--muted); }

.kpis { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 10px; }
.kpi { background: var(--card); border-radius: 16px; padding: 12px 8px; box-shadow: var(--shadow); text-align: center; position: relative; overflow: hidden; }
.kpi::before { content: ''; position: absolute; left: 0; right: 0; top: 0; height: 4px; }
.kpi b { display: block; font-size: 26px; font-weight: 800; line-height: 1.1; }
.kpi span { font-size: 11px; color: var(--muted); font-weight: 600; }
.k-ink::before { background: var(--ink); } .k-green::before { background: var(--green); } .k-teal::before { background: var(--teal); }
.k-orange::before { background: var(--orange); } .k-red::before { background: var(--red); }
.hint { font-size: 13px; color: var(--muted); margin: 6px 2px 10px; }

.list { display: grid; gap: 8px; }
button.item { width: 100%; text-align: left; font: inherit; color: inherit; }
.list .item, .item { display: flex; gap: 12px; align-items: center; background: var(--card); border: 0; border-radius: 16px; padding: 12px; margin: 0; box-shadow: var(--shadow); cursor: pointer; }
.item .chev { color: #C3C0BA; font-size: 22px; }
.pills { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
.pill.orange { background: var(--tint); color: var(--orange-d); }
.stars-sm { color: #F2A900; font-size: 13px; letter-spacing: -1px; }
.av { width: 44px; height: 44px; border-radius: 50%; flex: none; display: inline-flex; align-items: center; justify-content: center;
  font-weight: 800; font-size: 15px; color: #fff; background: #B9B6B0; }
.av.lg { width: 52px; height: 52px; font-size: 18px; }
.av.xl { width: 84px; height: 84px; font-size: 30px; box-shadow: 0 0 0 4px var(--card), 0 6px 20px rgba(0,0,0,.12); }
.rag-G { background: var(--green); } .rag-A { background: #E59A00; } .rag-R { background: var(--red); } .rag-X { background: #A9A6B0; }
.av.co-LINK { background: var(--orange); } .av.co-JUSS { background: linear-gradient(135deg, #E0864A, #2FB5C0); }
.datehead { display: flex; justify-content: space-between; margin: 18px 4px 8px; }
.datehead span { background: var(--soft2); color: var(--ink); border-radius: 999px; padding: 0 9px; font-size: 12px; }
.section-h { display: flex; justify-content: space-between; align-items: baseline; margin: 20px 4px 8px; font-weight: 800; font-size: 13px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.section-h span { text-transform: none; letter-spacing: 0; font-weight: 600; font-size: 12px; }
.empty { text-align: center; color: var(--muted); padding: 30px 20px; }
.empty .big-emoji { font-size: 44px; margin: 0 0 6px; }

.hero { display: flex; align-items: center; gap: 16px; background: linear-gradient(135deg, #2F2F38, #1C1C24); color: #fff; border-radius: 22px; padding: 16px 18px; box-shadow: var(--shadow); }
.hero-txt { display: flex; flex-direction: column; gap: 3px; }
.hero-txt b { font-size: 19px; } .hero-txt span { opacity: .8; font-size: 13px; }
.ring { width: 92px; height: 92px; flex: none; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring-bg { stroke: rgba(255,255,255,.14); } .ring-fg { stroke: var(--orange); stroke-linecap: round; transition: stroke-dasharray .6s ease; }
.ring-fg.done { stroke: #3DDC84; }
.ring text { transform: rotate(90deg); transform-origin: 50% 50%; fill: #fff; font-size: 26px; font-weight: 800; }
.ring tspan { font-size: 14px; opacity: .7; }

.payrow { display: flex; align-items: center; gap: 12px; background: var(--card); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); cursor: pointer; }
.payrow .main { flex: 1; min-width: 0; }
.rank { width: 30px; height: 30px; border-radius: 50%; background: var(--soft); display: inline-flex; align-items: center; justify-content: center; font-weight: 800; font-size: 13px; flex: none; }
.rank.top1 { background: #F5C542; } .rank.top2 { background: #D5D8DE; } .rank.top3 { background: #E3A877; }
.bar { height: 8px; background: var(--soft); border-radius: 99px; overflow: hidden; margin: 7px 0 2px; }
.bar i { display: block; height: 100%; background: var(--orange); border-radius: 99px; }
.bar.done i { background: var(--green); }
.net { text-align: right; } .net b { font-size: 26px; font-weight: 800; } .net span { color: var(--muted); font-size: 13px; }
